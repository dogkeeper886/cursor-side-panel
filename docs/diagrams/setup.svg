<svg xmlns="http://www.w3.org/2000/svg" width="840" height="764" viewBox="0 0 840 764" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="840" height="764" fill="#ffffff"/>
  <text x="420" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">From a right-click to TestLink</text>
  <text x="420" y="56" text-anchor="middle" font-size="13" fill="#64748b">Where each part runs, and the numbered step that sets it up</text>

  <!-- bands: where each part runs -->
  <g fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5">
    <rect x="20" y="80" width="800" height="120" rx="10"/>
    <rect x="20" y="228" width="800" height="90" rx="10"/>
    <rect x="20" y="346" width="800" height="290" rx="10"/>
    <rect x="20" y="664" width="800" height="80" rx="10"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#94a3b8" letter-spacing="0.5" text-anchor="end">
    <text x="804" y="97">YOUR BROWSER</text>
    <text x="804" y="245">CURSOR</text>
    <text x="804" y="363">SELF-HOSTED MACHINE</text>
    <text x="804" y="681">TESTLINK SERVER</text>
  </g>

  <!-- what runs -->
  <rect x="40" y="108" width="240" height="64" rx="8" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="160" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Cursor Side Panel</text>
  <text x="160" y="155" text-anchor="middle" font-size="12" fill="#dbeafe">cursor.com/agents beside any page</text>

  <g fill="#eff6ff" stroke="#2563eb" stroke-width="1.5">
    <rect x="40" y="256" width="240" height="48" rx="8"/>
    <rect x="40" y="374" width="240" height="56" rx="8"/>
    <rect x="40" y="480" width="115" height="56" rx="8"/>
    <rect x="165" y="480" width="115" height="56" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1e3a8a">
    <text x="160" y="276" font-size="14" font-weight="bold">Cursor</text>
    <text x="160" y="294" font-size="12">runs the agent loop and model</text>
    <text x="160" y="397" font-size="14" font-weight="bold">agent worker</text>
    <text x="160" y="417" font-size="11.5" font-family="'Liberation Mono', monospace">--name my-devbox</text>
    <text x="97" y="503" font-size="13.5" font-weight="bold">testlink-mcp</text>
    <text x="97" y="521" font-size="11.5">MCP server</text>
    <text x="222" y="503" font-size="13.5" font-weight="bold">Skills</text>
    <text x="222" y="521" font-size="11.5">SKILL.md folders</text>
  </g>

  <rect x="40" y="688" width="240" height="46" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="160" y="708" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">TestLink</text>
  <text x="160" y="726" text-anchor="middle" font-size="12" fill="#15803d">XML-RPC API</text>

  <!-- how a request travels -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <path d="M160 172 L 160 254" marker-end="url(#arrow)"/>
    <path d="M160 306 L 160 372" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M97 430 L 97 478" marker-end="url(#arrow)"/>
    <path d="M222 430 L 222 478" marker-end="url(#arrow)"/>
    <path d="M97 536 L 97 686" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11.5" font-weight="bold">
    <text x="172" y="218" fill="#2563eb">prompt + chosen machine</text>
    <text x="172" y="336" fill="#2563eb">tool calls over the worker's outbound HTTPS</text>
    <text x="104" y="459" fill="#2563eb">stdio</text>
    <text x="229" y="459" fill="#2563eb">loads</text>
    <text x="106" y="652" fill="#16a34a">XML-RPC</text>
  </g>

  <!-- step badges -->
  <g fill="#1d4ed8">
    <circle cx="342" cy="118" r="10"/>
    <circle cx="342" cy="145" r="10"/>
    <circle cx="342" cy="172" r="10"/>
    <circle cx="342" cy="390" r="10"/>
    <circle cx="342" cy="494" r="10"/>
    <circle cx="342" cy="598" r="10"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">
    <text x="342" y="122">1</text>
    <text x="342" y="149">5</text>
    <text x="342" y="176">6</text>
    <text x="342" y="394">2</text>
    <text x="342" y="498">3</text>
    <text x="342" y="602">4</text>
  </g>

  <!-- steps -->
  <g font-size="13" fill="#0f172a">
    <text x="360" y="123" xml:space="preserve"><tspan font-weight="bold">Install the extension</tspan><tspan fill="#475569"> · Load unpacked at chrome://extensions</tspan></text>
    <text x="360" y="150" xml:space="preserve"><tspan font-weight="bold">Pick the machine</tspan><tspan fill="#475569"> · under My Machines; accept the register prompt</tspan></text>
    <text x="360" y="177" xml:space="preserve"><tspan font-weight="bold">Send to Cursor</tspan><tspan fill="#475569"> · right-click selected text, then press Send</tspan></text>
    <text x="360" y="395" font-weight="bold">Connect the machine</text>
    <text x="360" y="499" font-weight="bold">Install testlink-mcp</text>
    <text x="360" y="603" font-weight="bold">Install the skills</text>
  </g>
  <text x="330" y="286" font-size="13" fill="#64748b">Sign in once inside the side panel</text>
  <g font-size="12" font-family="'Liberation Mono', monospace" fill="#334155">
    <text x="360" y="416">curl https://cursor.com/install -fsS | bash</text>
    <text x="360" y="434">agent login</text>
    <text x="360" y="452">agent worker --name my-devbox --worker-dir "$HOME" start</text>
    <text x="360" y="520">git clone https://github.com/dogkeeper886/testlink-mcp.git</text>
    <text x="360" y="538">cd testlink-mcp &amp;&amp; npm install &amp;&amp; npm run build</text>
    <text x="360" y="556">cp worker/mcp.json.example ~/.cursor/mcp.json</text>
    <text x="360" y="624">cp -r worker/skills/* ~/.cursor/skills/</text>
  </g>
  <g font-size="12.5" fill="#64748b">
    <text x="360" y="470">A systemd user service keeps it running</text>
    <text x="360" y="574">then fill in the paths, TESTLINK_URL and TESTLINK_API_KEY</text>
    <text x="330" y="715">API key for step 3 · My Settings → API interface → Generate key</text>
  </g>
</svg>
